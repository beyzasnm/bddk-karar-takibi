<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDDK Veri ve Karar Takibi</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#10151c;color:#e9eef4}
body{max-width:1120px;margin:48px auto;padding:0 22px}
header{border-bottom:1px solid #394653;margin-bottom:22px}
h1{margin:4px 0 12px;font-size:clamp(30px,6vw,54px)}
p{color:#b9c8d8} .tag{color:#7fe0be;font-size:13px;letter-spacing:.16em}
#sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}
article{background:#19232d;border:1px solid #394653;padding:15px;border-radius:8px}
article p{margin:6px 0} .warn{color:#ffc180}
label{display:block;margin:24px 0 12px}
input{display:block;margin-top:7px;padding:10px;background:#19232d;color:inherit;border:1px solid #586879;border-radius:6px;width:min(94%,400px)}
.scroll{overflow:auto} table{width:100%;border-collapse:collapse;text-align:left}
td,th{padding:12px 10px;border-bottom:1px solid #394653;vertical-align:top}
th{font-size:13px;color:#b9c8d8} a{color:#92dbff} small{display:block;color:#b9c8d8;margin-top:5px}
#metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.metric{font-size:1.35rem;font-weight:700;color:#e9eef4}
#trend{width:100%;height:180px;margin:16px 0;display:block}
select{background:#19232d;color:inherit;padding:9px;max-width:100%}
details{margin:36px 0} summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<header><div class="tag">BANKACILIK DÜZENLEME VE DENETLEME KURUMU</div>
<h1>Bankacılık sektörü verileri</h1><p>Haftalık BDDK Bülteni · Sektör toplamı · Milyon TL</p></header>
<section aria-label="Haftalık veriler">
<p><a id="weekly-source">Resmî haftalık bülten</a></p>
<div id="metrics"></div>
<label for="series">Geçmiş gözlemler</label>
<select id="series"></select>
<svg id="trend" viewBox="0 0 600 180" preserveAspectRatio="none" aria-hidden="true"></svg>
<details><summary>Serinin veri tablosu</summary>
<table><thead><tr><th>Veri dönemi</th><th>Milyon TL</th></tr></thead><tbody id="history"></tbody></table>
</details>
</section>
<details><summary>Kurul kararları</summary>
<section id="sources" aria-label="Kaynak durumu"></section>
<label>Kararlarda ara <input id="query" type="search" placeholder="Başlık veya karar numarası"></label>
<p id="count" aria-live="polite"></p>
<div class="scroll"><table>
<thead><tr><th>Karar tarihi</th><th>Karar</th><th>Yayın tarihi</th><th>İlk görülme</th><th>Son kontrol</th><th>Belge</th></tr></thead>
<tbody id="rows"></tbody></table></div></details>
<script type="application/json" id="data">__DATA__</script>
<script>
const data = JSON.parse(document.querySelector('#data').textContent);
const format = new Intl.DateTimeFormat('tr-TR', {dateStyle:'short',timeStyle:'short',timeZone:'Europe/Istanbul'});
const time = value => value ? format.format(new Date(value)) : '—';
const element = (parent, tag, text) => {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  parent.append(node);
  return node;
};
const amount = new Intl.NumberFormat('tr-TR', {maximumFractionDigits:2});
const percent = new Intl.NumberFormat('tr-TR', {style:'percent', maximumFractionDigits:2, signDisplay:'exceptZero'});
const dateLabel = date => date.split('-').reverse().join('.');
const metrics = document.querySelector('#metrics');
const select = document.querySelector('#series');
const trend = document.querySelector('#trend');
const history = document.querySelector('#history');
document.querySelector('#weekly-source').href = data.weekly.source;
for (const series of data.weekly.series) {
  const card = element(metrics, 'article');
  element(card, 'strong', series.label);
  const latest = series.points.at(-1);
  const prior = series.points.at(-2);
  element(card, 'p', latest ? amount.format(latest.value) : 'Veri bekleniyor').className = 'metric';
  if (latest) {
    element(card, 'p', 'Veri dönemi · ' + dateLabel(latest.date));
    if (prior && prior.value !== 0) {
      const change = (latest.value - prior.value) / prior.value;
      element(card, 'p', percent.format(change) + ' · ' + dateLabel(prior.date) + ' dönemine göre');
    }
    element(select, 'option', series.label).value = series.id;
  }
  element(card, 'small', 'Son başarılı kontrol · ' + time(series.status.success));
  if (series.status.error) element(card, 'small', 'Son taramada kaynak hatası').className = 'warn';
  else if (latest && Date.now() - Date.parse(series.status.success) > 3 * 3600000) {
    element(card, 'small', 'Kontrol gecikmiş olabilir').className = 'warn';
  }
}
function showTrend() {
  trend.replaceChildren();
  history.replaceChildren();
  const series = data.weekly.series.find(item => item.id === select.value);
  if (!series) return;
  const values = series.points.map(point => point.value);
  const min = Math.min(...values);
  const span = Math.max(...values) - min || 1;
  const points = values.map((value, index) => [10 + index * 580 / Math.max(1, values.length - 1),
    165 - (value - min) * 150 / span].join(',')).join(' ');
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  line.setAttribute('points', points);
  line.setAttribute('fill', 'none');
  line.setAttribute('stroke', '#7fe0be');
  line.setAttribute('stroke-width', '3');
  line.setAttribute('vector-effect', 'non-scaling-stroke');
  trend.append(line);
  for (const point of [...series.points].reverse()) {
    const row = element(history, 'tr');
    element(row, 'td', dateLabel(point.date));
    element(row, 'td', amount.format(point.value));
  }
}
select.addEventListener('change', showTrend);
showTrend();
const sources = document.querySelector('#sources');
for (const source of Object.values(data.sources)) {
  const card = element(sources, 'article');
  element(card, 'strong', source.name);
  element(card, 'p', 'Son başarılı kontrol · ' + time(source.success));
  const overdue = !source.success || Date.now() - Date.parse(source.success) > 3 * 3600000;
  if (source.error || overdue) {
    const warning = source.error ? 'Son tarama başarısız · ' + time(source.attempt) : 'Kontrol gecikmiş olabilir';
    element(card, 'p', warning).className = 'warn';
  }
}
const query = document.querySelector('#query');
const rows = document.querySelector('#rows');
function render() {
  rows.replaceChildren();
  const needle = query.value.trim().toLocaleLowerCase('tr');
  const matches = data.decisions.filter(row =>
    (row.number + ' ' + row.title).toLocaleLowerCase('tr').includes(needle));
  document.querySelector('#count').textContent = matches.length + ' karar';
  for (const row of matches) {
    const tr = element(rows, 'tr');
    element(tr, 'td', row.date.split('-').reverse().join('.'));
    const title = element(tr, 'td', row.number + ' · ' + row.title);
    element(title, 'small', row.source);
    element(tr, 'td', row.publication_date || '—');
    element(tr, 'td', time(row.first_seen));
    element(tr, 'td', time(row.last_seen));
    const documentCell = element(tr, 'td');
    element(documentCell, 'a', 'BDDK belgesi').href = row.url;
    element(documentCell, 'small', row.archived ? 'Arşivlendi' : row.pdf_error ? 'İndirme yeniden denenecek' : 'İndirme bekliyor');
  }
}
query.addEventListener('input', render);
render();
</script>
</body>
</html>
