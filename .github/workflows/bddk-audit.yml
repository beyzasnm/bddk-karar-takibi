name: Bağımsız BDDK doğruluk denetimi
on:
  pull_request:
    paths: ['audit_bddk_source.py', 'audit_bddk_ui.cjs', '.github/workflows/bddk-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install beautifulsoup4==4.13.4 lxml==5.4.0
      - name: BDDK kaynağını bağımsız sorgula
        run: python audit_bddk_source.py
      - name: Arşivden oluşturulan gerçek ekranı doğrula
        run: |
          python -c 'import json; from build_treasury import STATE, render; render(json.loads(STATE.read_text()))'
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node audit_bddk_ui.cjs
