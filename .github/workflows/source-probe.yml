name: BDDK kaynak doğrulaması
on:
  push:
    paths: ['.github/workflows/source-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public bulletin forms
        run: |
          python - <<'PY'
          import re
          from urllib.request import urlopen
          url="https://www.bddk.org.tr/BultenHaftalik/tr/Gelismis"
          page=urlopen(url,timeout=25).read().decode("utf-8-sig")
          for name in ["baslangicTarih","bitisTarih","CokluPara"]:
              m=re.search(r'<select[^>]*id="'+name+r'"[^>]*>(.*?)</select>',page,re.S|re.I)
              rows=re.findall(r'<option[^>]*>.*?</option>',m[1],re.S|re.I) if m else []
              print("OPTIONS",name,len(rows),[r.strip() for r in rows[:3]+rows[-3:]])
          for name in ["gelismisRaporGetir","KalemSpan","TarafSpan"]:
              i=page.find("$('#"+name+"').click")
              print("JS",name,page[i:i+3900] if i>=0 else "")
          for line in page.splitlines():
              if re.search(r'kalemSutunSec|KalemEkle|TarafEkle|1000[12]|onclick=.*[12]\.0\.1',line,re.I):
                  print(line.strip()[:350])
          PY
